name: Build Logic Antora docs
description: Install the locked docs dependencies and build the Antora site.
inputs:
  directory:
    description: Documentation package directory relative to the caller checkout
    default: docs/antora
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: ${{ inputs.directory }}/package-lock.json
    - shell: bash
      working-directory: ${{ inputs.directory }}
      run: npm ci
    - shell: bash
      working-directory: ${{ inputs.directory }}
      run: npm run build
