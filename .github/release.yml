changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Security
      labels: [security]
    - title: Removed
      labels: [removed]
    - title: Deprecated
      labels: [deprecated]
    - title: Fixed
      labels: [bug, fix]
    - title: Added
      labels: [enhancement, feature]
    - title: Changed
      labels: ['*']
