name: Bug report
description: Report unexpected behavior.
labels: [bug]
body:
  - type: textarea
    id: observed
    attributes:
      label: "What happened?"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "What did you expect?"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to reproduce and affected versions"
    validations:
      required: true
